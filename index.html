<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterchef MMORPG</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        html {height:100%}
        body {
            margin: 0;
            padding: 0;
            background-color: #333; /* Dark background for contrast */
            display: flex;
            flex-direction:column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Prevent scrollbars if canvas is larger than viewport */
        }
        main {
            flex:1;
            display:flex;
        }
        canvas {
            border: 1px solid red;
            position:absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            display: flex; /* Remove extra space below canvas */
            z-index:1
        }
    </style>
</head>
<body>
    <header>
        <p>MasterCHEF MMORPG</p>
    </header>
    <main>
        <div id="game-container"></div>
    </main>

</body>
</html>
